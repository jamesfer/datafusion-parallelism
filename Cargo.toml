[workspace]
members = ["tpc"]

[package]
name = "datafusion-parallelism"
version = "0.1.0"
edition = "2021"
autobenches = false

[profile.release-with-debug]
inherits = "release"
debug = true

[[bench]]
name = "my_benchmark"
harness = false

[[bench]]
name = "exponential_distribution"
harness = false

[[bench]]
name = "build_speed"
harness = false

[[bench]]
name = "lookup_speed"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "hash_map_lookup_speed"
harness = false

[[bench]]
name = "parallel_build_time"
harness = false

[[bin]]
name = "compare_probe_sequences"
path = "bin/compare_probe_sequences.rs"

[dependencies]
async-std = "1.13.0"
datafusion = "40.0.0"
datafusion-common = "40.0.0"
datafusion-physical-expr = "40.0.0"
datafusion-physical-expr-common = "40.0.0"
datafusion-physical-plan = "40.0.0"
tokio = { version = "1.39.2", features = ["rt", "rt-multi-thread", "macros"] }
futures-core = "0.3.30"
boxcar = "0.2.5"
dashmap = { version = "6.0.1", features = ["raw-api"] }
crossbeam = "0.8.4"
futures = "0.3.30"
ahash = "0.8.11"
flume = "0.11.0"
rand = "0.8.5"
pin-project-lite = "0.2.14"
async-trait = "0.1.81"
hashbrown = "0.14.5"
num-traits = "0.2.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
